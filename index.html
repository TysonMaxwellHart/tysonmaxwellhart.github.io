<!DOCTYPE html>
<html>
<head>
    <title>Animal Videos</title>

    <style>
        body {
            font-family: Arial;
            background: #222;
            color: white;
            text-align: center;
        }

        .button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 20px;
            cursor: pointer;
        }

        .section {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>🐾 Animal Video Hub</h1>

    <button class="button" onclick="showSection('cats')">
        Cat Videos
    </button>

    <button class="button" onclick="showSection('dogs')">
        Dog Videos
    </button>

    <button class="button" onclick="showSection('frogs')">
        Frog Videos
    </button>

    <div id="cats" class="section">
        <h2>🐱 Cat Videos</h2>

        <video width="600" controls>
            <source src="catvideo.mp4" type="video/mp4">
        </video>
    </div>

    <div id="dogs" class="section">
        <h2>🐶 Dog Videos</h2>

        <video width="600" controls>
            <source src="dogvideo.mp4" type="video/mp4">
        </video>
    </div>

    <div id="frogs" class="section">
        <h2>🐸 Frog Videos</h2>

        <video width="600" controls>
            <source src="frogvideo.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        function showSection(id) {

            let sections =
                document.querySelectorAll('.section');

            sections.forEach(section => {
                section.style.display = 'none';
            });

            document.getElementById(id).style.display =
                'block';
        }
    </script>

</body>
</html>
