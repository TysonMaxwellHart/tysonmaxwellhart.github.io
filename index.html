<!DOCTYPE html>
<html>
<head>
    <title>Animal Videos</title>

    <style>
        body {
            font-family: Arial;
            background: #222;
            color: white;
            text-align: center;
        }

        .button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 20px;
            cursor: pointer;
        }

        .section {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>🐾 Animal Video Hub</h1>

    <button class="button" onclick="showSection('Futa')">
        Futa Videos
    </button>

    <button class="button" onclick="showSection('Femboy')">
        Femboy Videos
    </button>

    <button class="button" onclick="showSection('Straight')">
        Straight Videos
    </button>

    <div id="Futa" class="section">
        <h2>♀️🍆 Futa Videos</h2>

        <video width="600" controls>
            <source src="https://cdn.rule34.gg/3nLzI1zYOtjQyiJ-lBLH2A.mp4" type="video/mp4">
        </video>
    </div>

    <div id="Femboy" class="section">
        <h2>♂️🍆 Femboy Videos</h2>

        <video width="600" controls>
            <source src="https://cdn.rule34vault.com/posts/1206/1206192/1206192.480.mp4" type="video/mp4">
        </video>
    </div>

    <div id="Straight" class="section">
        <h2>♂️♀️ Straight Videos</h2>

        <video width="600" controls>
            <source src="https://static1.e621.net/data/37/a7/37a78dd0ea0646b26a173ae22be6eb0f.gif" type="video/mp4">
        </video>
    </div>

    <script>
        function showSection(id) {

            let sections =
                document.querySelectorAll('.section');

            sections.forEach(section => {
                section.style.display = 'none';
            });

            document.getElementById(id).style.display =
                'block';
        }
    </script>

</body>
</html>
