<!DOCTYPE html>
<html>
<head>
    <title>TysonHub</title>

    <style>
        body {
            font-family: Arial;
            background: #222;
            color: white;
            text-align: center;
        }

        .button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 20px;
            cursor: pointer;
        }

        .section {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>🐾 Animal Video Hub</h1>

    <button class="button" onclick="showSection('Futa')">
        Futa
    </button>

    <button class="button" onclick="showSection('Femboy')">
        Femboy
    </button>

    <button class="button" onclick="showSection('Straight')">
        Straight
    </button>

    <div id="Futa" class="section">
        <h2> ♀️🍆 Futa</h2>

        <iframe
    width="640"
    height="360"
    src="https://cdn.rule34.gg/3nLzI1zYOtjQyiJ-lBLH2A.mp4"
    allowfullscreen>
</iframe>

    <div id="Femboy" class="section">
        <h2> ♂️🍆 Femboy</h2>

        <iframe
    width="640"
    height="360"
    src="https://cdn.rule34vault.com/posts/1206/1206192/1206192.480.mp4"
    allowfullscreen>
</iframe>

    <div id="Straight" class="section">
        <h2> ♂️♀️ Straight</h2>

        <iframe
    width="640"
    height="360"
    src="https://cdn.rule34vault.com/posts/1206/1206192/1206192.480.mp4"
    allowfullscreen>
</iframe>

    <script>
        function showSection(id) {

            let sections =
                document.querySelectorAll('.section');

            sections.forEach(section => {
                section.style.display = 'none';
            });

            document.getElementById(id).style.display =
                'block';
        }
    </script>

</body>
</html>
